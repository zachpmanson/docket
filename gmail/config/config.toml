# Default calendar for `docket cal *` commands without an explicit --calendar.
# This is the CalDAV calendar id of the "Docket" calendar on zachpmanson@gmail.com
# (discovered via calendar-home PROPFIND). Leaving it unset falls back to the
# account's own primary calendar, as before.
#
# NOTE: must stay ABOVE the [provider] table header — TOML assigns every key
# after a header to that table, so this would decode as provider.default_calendar
# otherwise.
default_calendar = "c58fca62a8cdaaf713956f6620bd7c39ef0892e91aa289e603c07f435eee7831@group.calendar.google.com"

[provider]
# Values pinned from searchfox.org/comm-central/source/mailnews/base/src/OAuth2Providers.sys.mjs
# Verify use_pkce and redirect_uri against current source if login ever breaks.
# These are Mozilla Thunderbird's borrowed OAuth client — not a secret Zach controls, already
# public in Mozilla's own source. See docket-design.md §3 and §8 for the tradeoffs.
client_id     = "406964657835-aq8lmia8j95dhl1a2bvharmfk3t1hgqj.apps.googleusercontent.com"
client_secret = "kSmqreRr0qwBWJgbf5Y-PjSU"
auth_url      = "https://accounts.google.com/o/oauth2/auth"
token_url     = "https://www.googleapis.com/oauth2/v3/token"
redirect_uri  = "http://localhost"
use_pkce      = true
scopes = [
  "https://mail.google.com/",
  "https://www.googleapis.com/auth/calendar",
  "email",
]
