name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  nix:
    name: Nix CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # --rebuild requires an existing output, including on a fresh runner.
      - name: Realise dependency output
        run: nix build .#default.goModules
      # Do not replace this with a cached package build. A fixed-output
      # dependency can already exist under the declared (but stale) hash.
      - name: Force vendor hash verification
        run: nix build .#default.goModules --rebuild
      - name: Test and vet both Go modules
        run: nix develop --command make test vet
      - name: Check flake
        run: nix flake check
      - name: Build package
        run: nix build .#default
